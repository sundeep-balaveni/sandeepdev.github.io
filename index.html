<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AppOrbit | Production Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<style>
:root {
  --bg:#0b1220; --card:#111827; --border:#1f2937;
  --text:#e5e7eb; --muted:#9ca3af;
}
body.light {
  --bg:#f4f6f9; --card:#ffffff; --border:#d1d5db;
  --text:#111827; --muted:#6b7280;
}
body { background:var(--bg); color:var(--text); font-family:system-ui; }
.navbar { background:var(--card); border-bottom:1px solid var(--border); }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; }
.metric-title { font-size:13px; color:var(--muted); }
.metric-value { font-size:22px; font-weight:600; }
.chart { height:150px; }

.alert-stream { max-height:280px; overflow:hidden; }
.alert-item {
  padding:10px; font-size:13px; margin-bottom:8px;
  border-left:4px solid; animation:slideIn .4s ease;
  background:rgba(0,0,0,.05);
}
.ok{border-color:#22c55e;} .warn{border-color:#fbbf24;} .crit{border-color:#ef4444;}
@keyframes slideIn { from{opacity:0;transform:translateX(30px)} to{opacity:1} }

.toggle {
  background:transparent; border:1px solid var(--border);
  color:var(--text); padding:6px 12px; border-radius:6px;
}
.toggle:hover { border-color:#3b82f6; color:#3b82f6; }
.code { font-family:monospace; color:#60a5fa; }
</style>
</head>

<body>

<nav class="navbar px-4 py-2">
  <span class="navbar-brand fw-semibold">AppOrbit – Production Monitoring</span>
  <div class="ms-auto d-flex gap-3 align-items-center">
    <span class="text-muted">ap-south-1 · prod</span>
    <button class="toggle" onclick="toggleTheme()">Dark / Light</button>
  </div>
</nav>

<div class="container-fluid mt-4">

<!-- METRICS -->
<div class="row g-4">
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">CPU Utilization</div><div class="metric-value"><span id="cpuVal">45</span>%</div><div id="cpu" class="chart"></div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Memory Utilization</div><div class="metric-value"><span id="memVal">68</span>%</div><div id="memory" class="chart"></div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Request Rate</div><div class="metric-value"><span id="rpsVal">1240</span> rps</div><div id="rps" class="chart"></div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Latency</div><div class="metric-value"><span id="latVal">118</span> ms</div><div id="latency" class="chart"></div></div></div>
</div>

<div class="row g-4 mt-1">
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Network In</div><div class="metric-value"><span id="netVal">42</span> Mbps</div><div id="network" class="chart"></div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Disk IOPS</div><div class="metric-value"><span id="diskVal">320</span></div><div id="disk" class="chart"></div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Queue Depth</div><div class="metric-value"><span id="queueVal">38</span></div><div id="queue" class="chart"></div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Cache Hit Ratio</div><div class="metric-value"><span id="cacheVal">94</span>%</div><div id="cache" class="chart"></div></div></div>
</div>

<!-- KUBERNETES -->
<div class="row g-4 mt-2">
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Pods (Running / Desired)</div><div class="metric-value"><span id="podsRun">6</span> / <span id="podsDes">6</span><
