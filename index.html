<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudWatch Dashboard | Sandeep</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="topbar">
  <h1>CloudWatch</h1>
  <div class="meta">
    <span>Environment: <b>production</b></span>
    <span>Region: <b>ap-south-1</b></span>
  </div>
</header>

<section class="widgets">

  <div class="widget">
    <span>EC2 CPU Utilization</span>
    <b id="cpuVal">42%</b>
    <canvas id="cpuChart"></canvas>
  </div>

  <div class="widget">
    <span>Memory Utilization</span>
    <b id="memVal">63%</b>
    <canvas id="memChart"></canvas>
  </div>

  <div class="widget">
    <span>Disk Throughput</span>
    <b id="diskVal">120 MB/s</b>
    <canvas id="diskChart"></canvas>
  </div>

  <div class="widget">
    <span>Network In</span>
