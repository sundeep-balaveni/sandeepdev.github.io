<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudWatch Dashboard | Sandeep Balaveni</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header class="cw-header">
  <div>
    <h1>CloudWatch</h1>
    <span class="subtitle">Overview · Production · ap-south-1</span>
  </div>
</header>

<main class="dashboard">

  <!-- 8 METRIC WIDGETS -->
  <div class="widget">
    <div class="title">EC2 CPU Utilization</div>
    <canvas id="cpu"></canvas>
  </div>

  <div class="widget">
    <div class="title">Memory Utilization</div>
    <canvas id="memory"></canvas>
  </div>

  <div class="widget">
    <div class="title">Disk Read / Write</div>
    <canvas id="disk"></canvas>
  </div>

  <div class="widget">
    <div class="title">Network In</div>
    <canvas id="netin"></canvas>
  </div>

  <div class="widget">
    <div class="title">Network Out</div>
    <canvas id="netout"></canvas>
  </div>

  <div class="widget">
    <div class="title">Request Count</div>
    <canvas id="req"></canvas>
  </div>

  <div class="widget">
    <div class="title">HTTP 5XX Errors</div>
    <canvas id="err"></canvas>
  </div>

  <div class="widget">
    <div class="title">Target Response Time</div>
    <canvas id="lat"></canvas>
  </div>

</main>

<footer class="cw-footer">
  Portfolio dashboard representing deployed AWS workloads (2024)
</footer>

<script src="dashboard.js"></script>
</body>
</html>
