<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AppOrbit | Production Test_v1_04</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<style>
:root {
  --bg:#0b1220; --card:#111827; --border:#1f2937;
  --text:#e5e7eb; --muted:#9ca3af;
}
body.light {
  --bg:#f4f6f9; --card:#ffffff; --border:#d1d5db;
  --text:#111827; --muted:#6b7280;
}
body { background:var(--bg); color:var(--text); font-family:system-ui; }
.navbar { background:var(--card); border-bottom:1px solid var(--border); }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; }
.metric-title { font-size:13px; color:var(--muted); }
.metric-value { font-size:22px; font-weight:600; }
.chart { height:150px; }

.alert-stream { max-height:260px; overflow:hidden; }
.alert-item {
  padding:10px; font-size:13px; margin-bottom:8px;
  border-left:4px solid; background:rgba(0,0,0,.05);
  animation:slideIn .4s ease;
}
.ok{border-color:#22c55e;}
.warn{border-color:#fbbf24;}
.crit{border-color:#ef4444;}

@keyframes slideIn {
  from{opacity:0;transform:translateX(30px)}
  to{opacity:1}
}

.toggle {
  background:transparent; border:1px solid var(--border);
  color:var(--text); padding:6px 12px; border-radius:6px;
}
.toggle:hover { border-color:#3b82f6; color:#3b82f6; }

.code { font-family:monospace; color:#60a5fa; }

.log-box { font-family:monospace; font-size:12px; height:180px; overflow:hidden; }
.heat div { height:14px; margin-bottom:4px; }
</style>
</head>

<body>

<nav class="navbar px-4 py-2">
  <span class="navbar-brand fw-semibold">AppOrbit – Test_v1_04</span>
  <div class="ms-auto d-flex gap-3 align-items-center">
    <span class="text-muted">ap-south-1 · Test</span>
    <button class="toggle" onclick="toggleTheme()">Dark / Light</button>
  </div>
</nav>

<div class="container-fluid mt-4">

<!-- ================= CORE METRICS ================= -->
<div class="row g-4">
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">CPU Utilization</div><div class="metric-value"><span id="cpuVal">45</span>%</div><div id="cpu" class="chart"></div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Memory Utilization</div><div class="metric-value"><span id="memVal">68</span>%</div><div id="memory" class="chart"></div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Request Rate</div><div class="metric-value"><span id="rpsVal">1240</span> rps</div><div id="rps" class="chart"></div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="metric-title">Latency</div><div class="metric-value"><span id="latVal">118</span> ms</div><div id="latency" class="chart"></div></div></div>
</div>

<!-- ================= NEW GRAPHS ================= -->
<div class="row g-4 mt-3">

  <div class="col-md-4">
    <div class="card p-3">
      <div class="metric-title">Load Balancer Target Response Time</div>
      <div id="lbLatency" class="chart"></div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card p-3">
      <div class="metric-title">HTTP Status Codes</div>
      <div id="httpCodes" class="chart"></div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card p-3">
      <div class="metric-title">Database Connections</div>
      <div id="dbConn" class="chart"></div>
    </div>
  </div>

</div>

<div class="row g-4 mt-2">

  <div class="col-md-6">
    <div class="card p-3">
      <div class="metric-title">Pod CPU Usage by Replica</div>
      <div id="podCpu" class="chart"></div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card p-3">
      <div class="metric-title">Queue Processing Rate</div>
      <div id="queueRate" class="chart"></div>
    </div>
  </div>

</div>

</div>

<script>
/* ---------- GRAPH HELPERS ---------- */
function line(id,color,fill=false){
  const y=Array(40).fill(0);
  Plotly.newPlot(id,[{y,type:"scattergl",mode:"lines",fill:fill?"tozeroy":null,line:{color,width:2}}],
  {margin:{l:30,r:10,t:10,b:20},paper_bgcolor:"transparent",plot_bgcolor:"transparent",xaxis:{visible:false},yaxis:{visible:false}},
  {displayModeBar:false});
  return y;
}

function bar(id,color){
  const y=Array(20).fill(0);
  Plotly.newPlot(id,[{y,type:"bar",marker:{color}}],
  {margin:{l:30,r:10,t:10,b:20},paper_bgcolor:"transparent",plot_bgcolor:"transparent",xaxis:{visible:false},yaxis:{visible:false}},
  {displayModeBar:false});
  return y;
}

/* ---------- EXISTING ---------- */
const cpu=line("cpu","#60a5fa"),
memory=line("memory","#34c38f",true),
latency=line("latency","#ff6b6b"),
rps=bar("rps","#a084e8");

/* ---------- NEW ---------- */
const lbLatency=line("lbLatency","#38bdf8");
const dbConnections=line("dbConn","#22c55e");
const queueRate=bar("queueRate","#f59e0b");

Plotly.newPlot("httpCodes",[
  {y:[90],type:"bar",name:"2xx",marker:{color:"#22c55e"}},
  {y:[6],type:"bar",name:"4xx",marker:{color:"#fbbf24"}},
  {y:[1],type:"bar",name:"5xx",marker:{color:"#ef4444"}}
],{
  barmode:"stack",
  margin:{l:30,r:10,t:10,b:20},
  paper_bgcolor:"transparent",
  plot_bgcolor:"transparent",
  xaxis:{visible:false},
  yaxis:{visible:false}
},{displayModeBar:false});

Plotly.newPlot("podCpu",[
  {y:[30],type:"scattergl",mode:"lines",line:{color:"#60a5fa"}},
  {y:[35],type:"scattergl",mode:"lines",line:{color:"#34c38f"}},
  {y:[28],type:"scattergl",mode:"lines",line:{color:"#fbbf24"}}
],{
  margin:{l:30,r:10,t:10,b:20},
  paper_bgcolor:"transparent",
  plot_bgcolor:"transparent",
  xaxis:{visible:false},
  yaxis:{visible:false}
},{displayModeBar:false});

function slow(b,v,l){return l+(b+(Math.random()-.5)*v-l)*.05;}

setInterval(()=>{
  cpu.push(slow(45,12,cpu.at(-1))); cpu.shift();
  memory.push(slow(68,6,memory.at(-1))); memory.shift();
  latency.push(slow(118,20,latency.at(-1))); latency.shift();
  rps.push(900+Math.random()*600); rps.shift();

  lbLatency.push(slow(110,25,lbLatency.at(-1))); lbLatency.shift();
  dbConnections.push(slow(30,8,dbConnections.at(-1))); dbConnections.shift();
  queueRate.push(400+Math.random()*200); queueRate.shift();

  Plotly.update("cpu",{y:[cpu]});
  Plotly.update("memory",{y:[memory]});
  Plotly.update("latency",{y:[latency]});
  Plotly.update("rps",{y:[rps]});
  Plotly.update("lbLatency",{y:[lbLatency]});
  Plotly.update("dbConn",{y:[dbConnections]});
  Plotly.update("queueRate",{y:[queueRate]});

  Plotly.update("httpCodes",{y:[[90],[6],[Math.random()*2]]});

},4000);

function toggleTheme(){document.body.classList.toggle("light");}
</script>

</body>
</html>
